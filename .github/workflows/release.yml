name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./apps/desktop
          tagName: v__VERSION__
          releaseName: "Lime v__VERSION__"
          releaseBody: |
            Lime Windows Release v__VERSION__

            ### Available Assets
            - **Windows NSIS Setup**: `.exe` installer (self-extracting standalone setup)
            - **Windows WiX MSI**: `.msi` package (Windows Installer format)
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify and attach all installer assets
        if: success()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME } else { "v0.1.0-pre-alpha.1" }
          Write-Host "Verifying installer assets for tag $tag..."
          
          # Discover all produced Windows installer bundles, updater archives, and signatures
          $bundleFiles = Get-ChildItem -Path "target\release\bundle", "apps\desktop\src-tauri\target\release\bundle" -Recurse -Include "*.exe","*.msi","*.sig","*.zip","*.json" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -Unique
          
          if ($bundleFiles) {
            Write-Host "Found installer artifacts:"
            $bundleFiles | ForEach-Object { Write-Host " - $_" }
            gh release upload $tag $bundleFiles --clobber
            Write-Host "Successfully attached all installer assets to release $tag."
          } else {
            Write-Host "Bundle artifacts uploaded directly by tauri-action."
          }
