name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Lime ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__' }}'
          releaseBody: |
            Lime Windows Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__' }}

            ### Available Assets
            - **Windows NSIS Setup**: `.exe` installer (self-extracting standalone setup)
            - **Windows WiX MSI**: `.msi` package (Windows Installer format)
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
