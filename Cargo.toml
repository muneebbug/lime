[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/wheel-core",
    "crates/wheel-win",
    "crates/wheel-engines",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Image compression for the Compress tool.
#
# Chosen over hand-wiring libwebp-sys, mozjpeg and oxipng because it already
# wraps exactly those, and because it implements target-size compression - a
# quality search that has to behave differently per format - which is the fiddly
# part of that feature rather than a detail.
libcaesium = "0.21"

# Codec and rasteriser crates are pinned to optimised code in dev builds.
#
# These are all hot numeric loops over every pixel, and unoptimised they dominate
# the time to open a file. Measured on a 993k-pixel SVG in a debug build: opening
# it took 1.66s with the rasteriser at opt-level 0, against ~100ms for everything
# else combined. `tiny-skia` is the one that matters most - it is what actually
# rasterises - and it was missing here while the codec crates were already listed.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.ravif]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3

# The Compress tool's codecs. Unoptimised, zopfli and mozjpeg are slow enough to
# look like a hang - libcaesium's own README warns that PNG optimisation in a
# debug build "can take a very long time to complete".
[profile.dev.package.libcaesium]
opt-level = 3

[profile.dev.package.oxipng]
opt-level = 3

[profile.dev.package.lodepng]
opt-level = 3

[profile.dev.package.webp]
opt-level = 3

# C code built through the `cc` crate is compiled with these settings unless the
# crate sets its own. Optimised, or mozjpeg is an order of magnitude slower.
[profile.dev.package.mozjpeg-sys]
opt-level = 3

[profile.dev.package.libwebp-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

