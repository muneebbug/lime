[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/wheel-core",
    "crates/wheel-win",
    "crates/wheel-engines",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
